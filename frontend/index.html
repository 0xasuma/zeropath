<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZeroPath</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --bg-color: #0a0a0f;
            --card-bg: #1a1a2e;
            --accent: #00ff88;
            --accent-dim: rgba(0, 255, 136, 0.1);
            --danger: #ff4444;
            --warning: #ff8800;
            --info: #00ccff;
            --text: #e0e0e0;
            --text-dim: #888;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-color);
            color: var(--text);
            min-height: 100vh;
            padding: 10px;
        }
        
        .tg-theme-bg {
            background: var(--bg-color);
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        
        /* Header */
        .header {
            text-align: center;
            padding: 20px 0;
        }
        .header h1 {
            color: var(--accent);
            font-size: 1.8em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .header .subtitle {
            color: var(--text-dim);
            font-size: 0.9em;
            margin-top: 5px;
        }
        
        /* Input Section */
        .input-section {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            color: var(--text-dim);
            font-size: 0.9em;
            margin-bottom: 8px;
        }
        .input-group input {
            width: 100%;
            padding: 15px;
            background: var(--bg-color);
            border: 1px solid #333;
            border-radius: 10px;
            color: var(--text);
            font-size: 1em;
        }
        .input-group input:focus {
            outline: none;
            border-color: var(--accent);
        }
        
        /* Scan Button */
        .scan-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, var(--accent) 0%, #00cc6a 100%);
            border: none;
            border-radius: 12px;
            color: #000;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .scan-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* Progress Section */
        .progress-section {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            display: none;
        }
        .progress-section.active {
            display: block;
        }
        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .progress-status {
            color: var(--accent);
            font-weight: bold;
        }
        .progress-percent {
            color: var(--text);
            font-size: 1.5em;
            font-weight: bold;
        }
        .progress-bar {
            height: 8px;
            background: var(--bg-color);
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), #00cc6a);
            width: 0%;
            transition: width 0.3s ease;
        }
        .progress-message {
            margin-top: 15px;
            color: var(--text-dim);
            font-size: 0.9em;
        }
        .progress-phase {
            display: inline-block;
            background: var(--accent-dim);
            color: var(--accent);
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.8em;
            margin-right: 10px;
        }
        
        /* Results Section */
        .results-section {
            display: none;
        }
        .results-section.active {
            display: block;
        }
        
        /* Summary Cards */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 20px 0;
        }
        .summary-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 15px 10px;
            text-align: center;
        }
        .summary-card .count {
            font-size: 1.8em;
            font-weight: bold;
        }
        .summary-card .label {
            font-size: 0.75em;
            color: var(--text-dim);
            margin-top: 5px;
        }
        .summary-card.critical .count { color: var(--danger); }
        .summary-card.high .count { color: var(--warning); }
        .summary-card.medium .count { color: #ffcc00; }
        .summary-card.low .count { color: var(--info); }
        
        /* Attack Chains */
        .section-title {
            color: var(--accent);
            font-size: 1.1em;
            margin: 25px 0 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .chain-card {
            background: linear-gradient(135deg, #1a0a2e 0%, #16133e 100%);
            border: 1px solid #8844ff;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 15px;
        }
        .chain-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .chain-type {
            background: #8844ff;
            color: white;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.75em;
        }
        .chain-complexity {
            background: #333;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.75em;
            color: var(--text-dim);
        }
        .chain-title {
            font-weight: bold;
            color: white;
        }
        .chain-desc {
            color: var(--text-dim);
            font-size: 0.9em;
            margin-bottom: 12px;
        }
        .chain-steps {
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            padding: 12px;
        }
        .chain-step {
            display: flex;
            gap: 12px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .chain-step:last-child {
            border-bottom: none;
        }
        .step-num {
            background: #8844ff;
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85em;
            flex-shrink: 0;
        }
        .step-content {
            color: var(--text);
            font-size: 0.9em;
        }
        .chain-impact {
            background: rgba(255, 68, 68, 0.1);
            border-left: 3px solid var(--danger);
            padding: 10px 12px;
            margin-top: 12px;
            font-size: 0.85em;
        }
        
        /* Findings List */
        .finding-card {
            background: var(--card-bg);
            border-left: 4px solid #888;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
        }
        .finding-card.critical { border-left-color: var(--danger); }
        .finding-card.high { border-left-color: var(--warning); }
        .finding-card.medium { border-left-color: #ffcc00; }
        .finding-card.low { border-left-color: var(--info); }
        .finding-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        .severity-badge {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75em;
            font-weight: bold;
        }
        .severity-badge.critical { background: var(--danger); color: white; }
        .severity-badge.high { background: var(--warning); color: white; }
        .severity-badge.medium { background: #ffcc00; color: black; }
        .severity-badge.low { background: var(--info); color: black; }
        .finding-name {
            font-weight: bold;
            flex: 1;
        }
        .finding-desc {
            color: var(--text-dim);
            font-size: 0.85em;
        }
        
        /* Report Button */
        .report-btn {
            width: 100%;
            padding: 15px;
            background: var(--card-bg);
            border: 2px solid var(--accent);
            border-radius: 12px;
            color: var(--accent);
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        /* New Scan Button */
        .new-scan-btn {
            width: 100%;
            padding: 15px;
            background: transparent;
            border: 1px solid #333;
            border-radius: 12px;
            color: var(--text-dim);
            font-size: 1em;
            cursor: pointer;
            margin-top: 10px;
        }
        
        /* Loading Spinner */
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid transparent;
            border-top-color: currentColor;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Expandable */
        .expandable {
            cursor: pointer;
        }
        .expandable-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }
        .expandable.expanded .expandable-content {
            max-height: 500px;
        }
        .expand-hint {
            color: var(--text-dim);
            font-size: 0.8em;
            text-align: center;
            margin-top: 8px;
        }
    </style>
</head>
<body class="tg-theme-bg">
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🛡️ ZeroPath</h1>
            <p class="subtitle">Autonomous Exploit Chain Generator</p>
        </div>
        
        <!-- Input Section -->
        <div class="input-section" id="inputSection">
            <div class="input-group">
                <label>Target URL</label>
                <input type="url" id="targetUrl" placeholder="https://example.com" />
            </div>
            <button class="scan-btn" id="scanBtn" onclick="startScan()">
                <span>🔍</span>
                <span>Start Scan</span>
            </button>
        </div>
        
        <!-- Progress Section -->
        <div class="progress-section" id="progressSection">
            <div class="progress-header">
                <span class="progress-status" id="progressStatus">Scanning...</span>
                <span class="progress-percent" id="progressPercent">0%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-message">
                <span class="progress-phase" id="progressPhase">RECON</span>
                <span id="progressText">Initializing...</span>
            </div>
        </div>
        
        <!-- Results Section -->
        <div class="results-section" id="resultsSection">
            <!-- Summary -->
            <div class="summary-grid" id="summaryGrid">
                <div class="summary-card critical">
                    <div class="count" id="criticalCount">0</div>
                    <div class="label">Critical</div>
                </div>
                <div class="summary-card high">
                    <div class="count" id="highCount">0</div>
                    <div class="label">High</div>
                </div>
                <div class="summary-card medium">
                    <div class="count" id="mediumCount">0</div>
                    <div class="label">Medium</div>
                </div>
                <div class="summary-card low">
                    <div class="count" id="lowCount">0</div>
                    <div class="label">Low</div>
                </div>
            </div>
            
            <!-- Attack Chains -->
            <div class="section-title">🔗 Attack Chains</div>
            <div id="chainsContainer"></div>
            
            <!-- Findings -->
            <div class="section-title">📋 All Findings</div>
            <div id="findingsContainer"></div>
            
            <!-- Actions -->
            <button class="report-btn" onclick="viewReport()">
                <span>📄</span>
                <span>View Full Report</span>
            </button>
            <button class="new-scan-btn" onclick="resetScan()">
                New Scan
            </button>
        </div>
    </div>
    
    <script>
        // Telegram WebApp init
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
            document.documentElement.style.setProperty('--bg-color', tg.themeParams.bg_color || '#0a0a0f');
            document.documentElement.style.setProperty('--card-bg', tg.themeParams.secondary_bg_color || '#1a1a2e');
            document.documentElement.style.setProperty('--text', tg.themeParams.text_color || '#e0e0e0');
        }
        
        // Config
        const API_URL = 'https://zeropath.secure-dana.my.id';
        const USER_ID = tg?.initDataUnsafe?.user?.id || 123456789;
        const USERNAME = tg?.initDataUnsafe?.user?.username || 'user';
        
        let currentScanId = null;
        let ws = null;
        
        // Start scan
        async function startScan() {
            const urlInput = document.getElementById('targetUrl');
            const url = urlInput.value.trim();
            
            if (!url) {
                urlInput.focus();
                return;
            }
            
            // Validate URL
            try {
                new URL(url);
            } catch {
                alert('Please enter a valid URL (include https://)');
                return;
            }
            
            // UI update
            document.getElementById('scanBtn').disabled = true;
            document.getElementById('scanBtn').innerHTML = '<div class="spinner"></div> Scanning...';
            document.getElementById('inputSection').style.display = 'none';
            document.getElementById('progressSection').classList.add('active');
            document.getElementById('resultsSection').classList.remove('active');
            
            // Connect WebSocket
            connectWebSocket();
            
            // Start scan API call
            try {
                const response = await fetch(`${API_URL}/api/scan`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        target_url: url,
                        user_id: USER_ID,
                        username: USERNAME
                    })
                });
                
                const data = await response.json();
                currentScanId = data.scan_id;
                
                // Poll for status
                pollStatus();
            } catch (error) {
                showError('Failed to start scan: ' + error.message);
            }
        }
        
        // WebSocket connection
        function connectWebSocket() {
            const wsUrl = `wss://${API_URL.replace('https://', '')}/ws/${USER_ID}`;
            ws = new WebSocket(wsUrl);
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleWsMessage(data);
            };
            
            ws.onerror = () => {
                console.log('WebSocket error, falling back to polling');
            };
            
            ws.onclose = () => {
                setTimeout(connectWebSocket, 5000);
            };
        }
        
        // Handle WebSocket messages
        function handleWsMessage(data) {
            if (data.type === 'progress') {
                updateProgress(data.progress, data.phase, data.message);
            } else if (data.type === 'completed') {
                showResults(data);
            } else if (data.type === 'error') {
                showError(data.message);
            }
        }
        
        // Poll status fallback
        async function pollStatus() {
            if (!currentScanId) return;
            
            try {
                const response = await fetch(`${API_URL}/api/scan/${currentScanId}`);
                const data = await response.json();
                
                updateProgress(data.progress, data.status, 'Scanning...');
                
                if (data.status === 'completed') {
                    showResults(data);
                } else if (data.status === 'error') {
                    showError(data.error || 'Scan failed');
                } else {
                    setTimeout(pollStatus, 2000);
                }
            } catch (error) {
                setTimeout(pollStatus, 5000);
            }
        }
        
        // Update progress UI
        function updateProgress(percent, phase, message) {
            document.getElementById('progressPercent').textContent = percent + '%';
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('progressPhase').textContent = phase?.toUpperCase() || 'SCAN';
            document.getElementById('progressText').textContent = message || 'Processing...';
        }
        
        // Show results
        function showResults(data) {
            document.getElementById('progressSection').classList.remove('active');
            document.getElementById('resultsSection').classList.add('active');
            
            // Count findings by severity
            const counts = { critical: 0, high: 0, medium: 0, low: 0 };
            (data.findings || []).forEach(f => {
                const sev = f.severity?.toLowerCase() || 'low';
                if (counts.hasOwnProperty(sev)) counts[sev]++;
            });
            
            document.getElementById('criticalCount').textContent = counts.critical;
            document.getElementById('highCount').textContent = counts.high;
            document.getElementById('mediumCount').textContent = counts.medium;
            document.getElementById('lowCount').textContent = counts.low;
            
            // Render chains
            const chainsContainer = document.getElementById('chainsContainer');
            chainsContainer.innerHTML = '';
            
            (data.attack_chains || []).forEach((chain, i) => {
                chainsContainer.innerHTML += renderChain(chain, i + 1);
            });
            
            if (!data.attack_chains?.length) {
                chainsContainer.innerHTML = '<p style="color: var(--text-dim);">No attack chains identified.</p>';
            }
            
            // Render findings
            const findingsContainer = document.getElementById('findingsContainer');
            findingsContainer.innerHTML = '';
            
            (data.findings || []).forEach((finding, i) => {
                if (finding.type !== 'error') {
                    findingsContainer.innerHTML += renderFinding(finding, i + 1);
                }
            });
            
            // Haptic feedback
            tg?.HapticFeedback?.notificationOccurred('success');
        }
        
        // Render chain card
        function renderChain(chain, num) {
            const steps = (chain.steps || []).map((step, i) => `
                <div class="chain-step">
                    <div class="step-num">${step.step || i + 1}</div>
                    <div class="step-content">${step.action}</div>
                </div>
            `).join('');
            
            return `
                <div class="chain-card">
                    <div class="chain-header">
                        <span class="chain-type">${chain.type?.replace('_', ' ') || 'chain'}</span>
                        <span class="chain-complexity">${chain.complexity || 'medium'}</span>
                    </div>
                    <div class="chain-title">${chain.name || 'Attack Chain ' + num}</div>
                    <div class="chain-desc">${chain.description || ''}</div>
                    <div class="chain-steps">${steps}</div>
                    ${chain.impact ? `<div class="chain-impact"><strong>Impact:</strong> ${chain.impact}</div>` : ''}
                </div>
            `;
        }
        
        // Render finding card
        function renderFinding(finding, num) {
            return `
                <div class="finding-card ${finding.severity || 'low'}">
                    <div class="finding-header">
                        <span class="severity-badge ${finding.severity || 'low'}">${(finding.severity || 'low').toUpperCase()}</span>
                        <span class="finding-name">${finding.name || 'Finding ' + num}</span>
                    </div>
                    <div class="finding-desc">${finding.description || ''}</div>
                </div>
            `;
        }
        
        // View full report
        function viewReport() {
            if (currentScanId) {
                const reportUrl = `${API_URL}/api/report/${currentScanId}`;
                if (tg) {
                    tg.openLink(reportUrl);
                } else {
                    window.open(reportUrl, '_blank');
                }
            }
        }
        
        // Reset for new scan
        function resetScan() {
            currentScanId = null;
            document.getElementById('targetUrl').value = '';
            document.getElementById('scanBtn').disabled = false;
            document.getElementById('scanBtn').innerHTML = '<span>🔍</span><span>Start Scan</span>';
            document.getElementById('inputSection').style.display = 'block';
            document.getElementById('progressSection').classList.remove('active');
            document.getElementById('resultsSection').classList.remove('active');
        }
        
        // Show error
        function showError(message) {
            document.getElementById('progressStatus').textContent = 'Error';
            document.getElementById('progressText').textContent = message;
            document.getElementById('progressFill').style.background = 'var(--danger)';
            tg?.HapticFeedback?.notificationOccurred('error');
            
            setTimeout(resetScan, 3000);
        }
        
        // Enter key to start scan
        document.getElementById('targetUrl').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') startScan();
        });
    </script>
</body>
</html>
